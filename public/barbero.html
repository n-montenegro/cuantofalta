<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16181d">
  <title>CuántoFalta · Panel del barbero</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <div class="marca">✂ <span>Cuánto<em>Falta</em></span></div>
    <div class="rol">Barbero</div>
  </header>

  <main class="contenedor">
    <div class="tarjeta">
      <label for="barbero" style="margin-top:0">¿Quién eres?</label>
      <select id="barbero"></select>
      <div class="contador">
        <div><b id="cEspera">0</b><small>esperando</small></div>
        <div><b id="cAtendidos">0</b><small>atendidos hoy</small></div>
        <div><b id="cEstimado">—</b><small>espera nueva</small></div>
      </div>
    </div>

    <div class="tarjeta">
      <h2>En la silla</h2>
      <div class="silla-actual" id="silla"><span class="vacia">Silla libre</span></div>

      <!-- Cada botón ejecuta un comando (patrón Command) -->
      <button class="boton gigante" id="siguiente">Siguiente ›</button>
      <div class="botones">
        <button class="boton secundario" id="noEsta">No está</button>
        <button class="boton secundario" id="deshacer">↶ Deshacer</button>
      </div>
    </div>

    <div class="tarjeta">
      <h2>En espera</h2>
      <ul class="lista" id="espera"></ul>
    </div>

    <div class="tarjeta">
      <h2>Cliente sin celular</h2>
      <input id="nombreManual" placeholder="Nombre del cliente" maxlength="40">
      <select id="servicioManual" style="margin-top:8px"></select>
      <button class="boton oscuro" id="agregar">+ Agregar a mi fila</button>
    </div>
  </main>

  <script src="comun.js"></script>
  <script>
    let servicios = [];
    let barberos = [];
    let filaActual = null;
    const id = () => document.getElementById("barbero").value;

    async function cargarDatos() {
      const { datos } = await api("/datos");
      servicios = datos.servicios;
      barberos = datos.barberos;
      const recordado = localStorage.getItem("cuantofalta-barbero");
      document.getElementById("barbero").innerHTML = barberos
        .map(b => `<option value="${b.id}" ${String(b.id) === recordado ? "selected" : ""}>${escapar(b.nombre)}${b.activo ? "" : " (en descanso)"}</option>`).join("");
      document.getElementById("servicioManual").innerHTML = servicios
        .map(s => `<option value="${s.id}">${escapar(s.nombre)} · ${s.minutos} min</option>`).join("");
      mostrarFila();
    }

    const nombreServicio = (servicioId) => (servicios.find(s => s.id === servicioId) || {}).nombre || "";

    function pintar(fila) {
      filaActual = fila;
      const silla = document.getElementById("silla");
      if (fila.enSilla) {
        const t = fila.enSilla;
        silla.innerHTML = `
          <div class="nombre">#${t.numero} · ${escapar(t.nombre)}</div>
          <div class="info">${escapar(nombreServicio(t.servicioId))} · lleva <span class="reloj" id="reloj">${minutosDesde(t.horaInicio)}</span> min</div>`;
      } else {
        silla.innerHTML = `<span class="vacia">Silla libre — toca "Siguiente" para llamar al primero</span>`;
      }

      document.getElementById("espera").innerHTML = fila.enEspera.length
        ? fila.enEspera.map((t, i) => `
          <li>
            <span class="num">${t.numero}</span>
            <span class="quien"><b>${escapar(t.nombre)}</b><small>${escapar(nombreServicio(t.servicioId))}${i === 0 ? " · sigue" : ""}</small></span>
            <span class="chip ${t.origen === "MANUAL" ? "manual" : ""}">${t.origen === "MANUAL" ? "Sin celular" : "QR"}</span>
          </li>`).join("")
        : `<li class="vacia">No hay nadie esperando</li>`;

      document.getElementById("cEspera").textContent = fila.enEspera.length;
      document.getElementById("cAtendidos").textContent = fila.atendidosHoy;
      document.getElementById("deshacer").disabled = !fila.puedeDeshacer;
      document.getElementById("noEsta").disabled = !fila.enSilla;
      document.getElementById("siguiente").disabled = !fila.enSilla && fila.enEspera.length === 0;
      document.getElementById("siguiente").textContent = fila.enSilla
        ? (fila.enEspera.length ? "Terminé · Siguiente ›" : "Terminé ✓")
        : "Llamar al siguiente ›";
    }

    async function mostrarFila() {
      if (!id()) return;
      localStorage.setItem("cuantofalta-barbero", id());
      const { ok, datos } = await api(`/barberos/${id()}/fila`);
      if (ok) pintar(datos);
      // Espera que vería un cliente nuevo con este barbero
      const estado = await api("/estado");
      const mio = estado.ok && estado.datos.barberos.find(b => String(b.id) === id());
      document.getElementById("cEstimado").textContent = mio ? mio.esperaNuevo + "'" : "—";
    }

    // Envía una acción al servidor y muestra el resultado
    async function accion(ruta, cuerpo, mensaje) {
      const { ok, datos } = await api(`/barberos/${id()}/${ruta}`, "POST", cuerpo || {});
      if (!ok) { avisar(datos.error, true); return false; }
      pintar(datos);
      if (mensaje) avisar(mensaje);
      mostrarFila();
      return true;
    }

    document.getElementById("siguiente").addEventListener("click", () => accion("siguiente", null, "Listo ✓"));
    document.getElementById("noEsta").addEventListener("click", () => accion("no-esta", null, "Marcado como ausente"));
    document.getElementById("deshacer").addEventListener("click", () => accion("deshacer", null, "Se deshizo la última acción"));
    document.getElementById("agregar").addEventListener("click", async () => {
      const ok = await accion("clientes", {
        nombre: document.getElementById("nombreManual").value,
        servicioId: document.getElementById("servicioManual").value,
      }, "Cliente agregado");
      if (ok) document.getElementById("nombreManual").value = "";
    });
    document.getElementById("barbero").addEventListener("change", mostrarFila);

    // El reloj de la silla avanza cada 30 s sin pedir datos
    setInterval(() => {
      const reloj = document.getElementById("reloj");
      if (reloj && filaActual?.enSilla) reloj.textContent = minutosDesde(filaActual.enSilla.horaInicio);
    }, 30000);
    setInterval(mostrarFila, 10000);
    cargarDatos();
  </script>
</body>
</html>
