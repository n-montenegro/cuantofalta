<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CuántoFalta - Tomar turno</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="tarjeta">
    <h1>CuántoFalta</h1>
    <p class="sub">Toma tu turno y mira cuánto te falta</p>

    <!-- Formulario para pedir turno -->
    <div id="formulario">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" placeholder="Ej: Andrés">
      <label for="servicio">Servicio</label>
      <select id="servicio"></select>
      <label for="barbero">Barbero</label>
      <select id="barbero"></select>
      <button id="tomar">Tomar turno</button>
      <p id="error" class="error"></p>
    </div>

    <!-- Información del turno (se muestra después de tomarlo) -->
    <div id="miTurno" class="oculto">
      <p>Tu turno es el <b id="numero"></b></p>
      <p id="posicion"></p>
      <p class="grande" id="minutos"></p>
      <p class="sub">Se actualiza solo cada 15 segundos.</p>
    </div>
  </div>

  <script>
    let numeroTurno = null;

    // Identificador del celular: se crea una vez y se guarda en el navegador
    function idCelular() {
      let id = localStorage.getItem("cuantofalta-celular");
      if (!id) {
        id = Date.now() + "-" + Math.random().toString(36).slice(2);
        localStorage.setItem("cuantofalta-celular", id);
      }
      return id;
    }

    // 1. Llenar las listas de servicios y barberos
    async function cargarDatos() {
      const datos = await (await fetch("/api/datos")).json();
      document.getElementById("servicio").innerHTML = datos.servicios
        .map(s => `<option value="${s.id}">${s.nombre} (${s.minutos} min)</option>`).join("");
      document.getElementById("barbero").innerHTML =
        `<option value="auto">El que esté libre primero</option>` +
        datos.barberos.map(b => `<option value="${b.id}">${b.nombre}</option>`).join("");
    }

    // 2. Pedir el turno al servidor
    async function tomarTurno() {
      const cuerpo = {
        nombre: document.getElementById("nombre").value,
        servicioId: document.getElementById("servicio").value,
        barberoId: document.getElementById("barbero").value,
        dispositivoId: idCelular(),
      };
      const respuesta = await fetch("/api/turnos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
      const datos = await respuesta.json();
      if (respuesta.status === 409) return mostrarTurno(datos.numero); // ya tenía un turno
      if (!respuesta.ok) {
        document.getElementById("error").textContent = datos.error;
        return;
      }
      mostrarTurno(datos.numero);
    }

    function mostrarTurno(numero) {
      numeroTurno = numero;
      document.getElementById("formulario").classList.add("oculto");
      document.getElementById("miTurno").classList.remove("oculto");
      actualizarTurno();
      setInterval(actualizarTurno, 15000);
    }

    // 3. Consultar cuánto falta
    async function actualizarTurno() {
      const respuesta = await fetch("/api/turnos/" + numeroTurno);
      const datos = await respuesta.json();
      const posicion = document.getElementById("posicion");
      const minutos = document.getElementById("minutos");
      if (!respuesta.ok) {
        posicion.textContent = datos.error;
        return;
      }
      document.getElementById("numero").textContent = datos.numero + " con " + datos.barbero;
      minutos.textContent = "";
      if (datos.estado === "EN_SILLA") {
        posicion.textContent = "¡Es tu turno! Pasa a la silla.";
      } else if (datos.estado === "AUSENTE") {
        posicion.textContent = "Te llamaron y no estabas. Habla con el barbero.";
      } else if (datos.estado === "ATENDIDO") {
        posicion.textContent = "Ya fuiste atendido. ¡Gracias!";
      } else {
        posicion.textContent = "Vas en el puesto " + datos.posicion;
        minutos.textContent = datos.minutos < 5 ? "Ya casi es tu turno" : "aprox. " + datos.minutos + " min";
      }
    }

    document.getElementById("tomar").addEventListener("click", tomarTurno);
    cargarDatos();
  </script>
</body>
</html>
