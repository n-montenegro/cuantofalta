name: Ejecutable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cuantofalta-ejecutables
          path: dist/
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
